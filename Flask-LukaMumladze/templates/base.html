<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Home page{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
  <style>
      div {
          font-family: myFirstFont;
          src: url(sansation_light.woff);
          font-weight: bold;
          text-align: center;
      }
  </style>

  <div class="container">
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
      <a href="/" class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
        <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap"><use xlink:href="#bootstrap"></use></svg>
      </a>

      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <li><a href="{{ url_for('home') }}" class="nav-link px-2 link-secondary">Home</a></li>
        <li><a href="{{ url_for('index') }}" class="nav-link px-2 link-dark">Tasks</a></li>
        <li><a href="{{ url_for('add_task') }}" class="nav-link px-2 link-dark">Add Task</a></li>
      </ul>

      <div class="col-md-3 text-end">
        <a href="{{ url_for('login') }}" class="btn btn-outline-primary me-2">Login</a>
        <a href="{{ url_for('register') }}" class="btn btn-primary">Sign-up</a>
      </div>
    </header>
  </div>

  {% block content %}
  {% endblock %}

</body>
</html>
